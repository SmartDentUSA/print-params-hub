openapi: 3.1.0
info:
  title: SmartOps – Marketing Treinamentos
  version: "1.2.0"
  description: >
    API do Sistema B para o GPT privado "SmartOps – Marketing Treinamentos".
    As rotas de consulta (`/smartops-marketing-agent-api/...`) são somente leitura: aceitam
    apenas GET e OPTIONS e retornam 405 em qualquer método de escrita.
    As rotas do pipeline de depoimentos e de entregáveis executam ações controladas
    (transcrição, upload ao Panda Video, publicação do artigo e registro de KITs sociais).
    Ordem obrigatória para depoimentos: auditar mídia → confirmar participante →
    transcribeTrainingTestimonial → uploadTrainingTestimonialToPanda (confirmar
    `panda_folder_id`, conversão e `video_player`) → publishTrainingTestimonial.
    Nunca chamar publishTrainingTestimonial antes de o Panda retornar `pandavideo_id`,
    `video_player`, status de conversão válido e `panda_folder_id` correto.
    `force` e `force_reupload` só podem ser usados a pedido expresso do usuário.
servers:
  - url: https://okeogjgqijbfkudfjadz.supabase.co/functions/v1
    description: Edge Functions do Sistema B (autenticadas por Bearer token exclusivo)
security:
  - MarketingAgentKey: []
tags:
  - name: Treinamentos
    description: Consulta de turmas, participantes e mídias no Google Drive
  - name: Depoimentos
    description: Transcrição, envio ao Panda Video e publicação dos depoimentos
  - name: Entregáveis
    description: Registro e revisão de KITs de conteúdo para redes sociais
paths:
  /smartops-marketing-agent-api/eligible-trainings:
    get:
      operationId: listEligibleTrainings
      tags: [Treinamentos]
      summary: Lista turmas aptas à produção de KIT de marketing
      description: Lista turmas ativas, não canceladas, com data válida, inscrição, pasta do Drive e subpastas. Pode incluir turmas inaptas com os motivos do bloqueio. O dia da semana não define a aptidão.
      parameters:
        - name: only_eligible
          in: query
          required: false
          description: Quando true, retorna apenas turmas aptas.
          schema: { type: boolean, default: false }
        - name: limit
          in: query
          required: false
          description: Máximo de turmas retornadas (1–200).
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: Lista de turmas
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  only_eligible: { type: boolean }
                  trainings:
                    type: array
                    items: { $ref: "#/components/schemas/EligibleTraining" }
              example:
                count: 1
                only_eligible: true
                trainings:
                  - turma_id: "d45c332e-546a-4cc4-bd30-6dbd5c01af1b"
                    turma_number: 169
                    course_title: "Imersão Chairside Print"
                    turma_label: "169º"
                    start_date: "2026-10-14"
                    end_date: "2026-10-16"
                    status: "agendada"
                    enrolled_count: 12
                    companions_count: 3
                    drive_folder_url: "https://drive.google.com/drive/folders/EXEMPLO"
                    is_eligible: true
                    blocking_reasons: []
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/ServerError" }
  /smartops-marketing-agent-api/trainings/by-number/{turma_number}:
    get:
      operationId: getTrainingDetails
      tags: [Treinamentos]
      summary: Dados oficiais da turma
      description: Retorna curso, número, datas, dias cadastrados, status, inscritos e completude da estrutura do Drive.
      parameters:
        - name: turma_number
          in: path
          required: true
          description: Número operacional da turma, por exemplo 157.
          schema:
            type: integer
            minimum: 1
          example: 157
      responses:
        "200":
          description: Detalhes da turma
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainingDetail" }
              example:
                turma_id: "d45c332e-546a-4cc4-bd30-6dbd5c01af1b"
                turma_number: 169
                turma_label: "169º"
                course: { title: "Imersão Chairside Print", slug: "imersao-chairside-print", duration_days: 3 }
                start_date: "2026-10-14"
                end_date: "2026-10-16"
                location: "São Paulo - SP"
                modality: "presencial"
                status: "agendada"
                days:
                  - { day_number: 1, date: "2026-10-14", start_time: "09:00", end_time: "18:00", topic: "Fundamentos" }
                enrolled_count: 12
                companions_count: 3
                drive_folder_id: "EXEMPLO_FOLDER_ID"
                drive_folder_url: "https://drive.google.com/drive/folders/EXEMPLO"
                drive_subfolder_keys: ["fotos_turma", "videos_vertical", "videos_depoimentos"]
                drive_structure: { expected: 10, present: 10, missing: [], complete: true }
                is_eligible: true
                blocking_reasons: []
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/ServerError" }
  /smartops-marketing-agent-api/trainings/by-number/{turma_number}/participants:
    get:
      operationId: listTrainingParticipants
      tags: [Treinamentos]
      summary: Participantes exclusivos da turma
      description: >
        Retorna inscritos titulares e acompanhantes da turma informada. Não retorna CPF,
        telefone, e-mail, endereço ou outros dados desnecessários.
      parameters:
        - name: turma_number
          in: path
          required: true
          description: Número operacional da turma, por exemplo 157.
          schema:
            type: integer
            minimum: 1
          example: 157
      responses:
        "200":
          description: Participantes
          content:
            application/json:
              schema:
                type: object
                properties:
                  turma_id: { type: string, format: uuid }
                  turma_number: { type: integer, nullable: true }
                  count: { type: integer }
                  participants:
                    type: array
                    items: { $ref: "#/components/schemas/Participant" }
              example:
                turma_id: "d45c332e-546a-4cc4-bd30-6dbd5c01af1b"
                turma_number: 169
                count: 2
                participants:
                  - enrollment_id: "11111111-1111-1111-1111-111111111111"
                    participant_name: "PARTICIPANTE EXEMPLO 1"
                    participant_type: "titular"
                    enrollment_status: "finalizado"
                    companion_id: null
                    companion_name: null
                    companion_type: null
                  - enrollment_id: "11111111-1111-1111-1111-111111111111"
                    participant_name: "PARTICIPANTE EXEMPLO 1"
                    participant_type: "titular"
                    enrollment_status: "finalizado"
                    companion_id: "22222222-2222-2222-2222-222222222222"
                    companion_name: "ACOMPANHANTE EXEMPLO"
                    companion_type: "acompanhante"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/ServerError" }
  /smartops-marketing-agent-api/trainings/by-number/{turma_number}/media-inventory:
    get:
      operationId: getTrainingMediaInventory
      tags: [Treinamentos]
      summary: Inventário real das mídias no Google Drive
      description: Consulta as subpastas da turma no Google Drive e retorna arquivos, formatos, tamanhos, dimensões, orientação, dia, participante e situação no banco. Não expõe credenciais nem sessões de upload.
      parameters:
        - name: turma_number
          in: path
          required: true
          description: Número operacional da turma, por exemplo 157.
          schema:
            type: integer
            minimum: 1
          example: 157
      responses:
        "200":
          description: Inventário
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaInventory" }
              example:
                turma_id: "d45c332e-546a-4cc4-bd30-6dbd5c01af1b"
                turma_number: 169
                course_title: "Imersão Chairside Print"
                drive_folder_url: "https://drive.google.com/drive/folders/EXEMPLO"
                total_files: 1
                missing_subfolders: []
                destinations:
                  - destination_key: "videos_vertical"
                    label: "04 - Vídeos Originais › 01 - Vídeos Verticais"
                    kind: "video"
                    requires_day: true
                    is_testimonial: false
                    drive_folder_id: "EXEMPLO_SUBFOLDER_ID"
                    file_count: 1
                    drive_error: null
                    files:
                      - drive_file_id: "EXEMPLO_FILE_ID"
                        filename: "T169_IMERSAO_CHAIRSIDE_PRINT_2026-10-14_DIA-1_VIDEO_VERTICAL_001.mp4"
                        mime_type: "video/mp4"
                        size_bytes: 48213456
                        created_time: "2026-10-14T18:22:03.000Z"
                        width: 1080
                        height: 1920
                        orientation: "vertical"
                        kind: "video"
                        day: "Dia 1"
                        participant_name: null
                        db_status: "completed"
                        registered_in_db: true
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/ServerError" }
  /smartops-marketing-agent-api/trainings/by-number/{turma_number}/media-gaps:
    get:
      operationId: getTrainingMediaGaps
      tags: [Treinamentos]
      summary: Lacunas de mídia frente ao checklist oficial
      description: Compara o Google Drive com o checklist e informa categorias ausentes, vídeos sem dia, depoimentos sem participante, formatos inválidos, falhas e divergências entre Drive e banco.
      parameters:
        - name: turma_number
          in: path
          required: true
          description: Número operacional da turma, por exemplo 157.
          schema:
            type: integer
            minimum: 1
          example: 157
      responses:
        "200":
          description: Lacunas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaGaps" }
              example:
                turma_id: "d45c332e-546a-4cc4-bd30-6dbd5c01af1b"
                turma_number: 169
                course_title: "Imersão Chairside Print"
                present_categories: ["videos_vertical"]
                missing_categories: ["fotos_turma", "fotos_participantes_certificados", "videos_depoimentos"]
                videos_without_day: []
                testimonials_without_participant: []
                participants_without_testimonial: ["PARTICIPANTE EXEMPLO 1"]
                invalid_formats: []
                pending_records: []
                failed_records: []
                drive_files_without_db_record: []
                db_records_without_drive_file: []
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/ServerError" }
  /smartops-marketing-agent-api/trainings/by-number/{turma_number}/media-access:
    get:
      operationId: getTrainingMediaAccess
      tags: [Treinamentos]
      summary: Acesso temporário somente-leitura a uma mídia real da turma
      description: >
        Devolve metadados reais (tipo, dimensões, orientação, duração, dia, participante)
        e URLs temporárias de leitura (original, prévia e miniatura) para UM arquivo do
        Google Drive, desde que ele pertença comprovadamente à turma informada.
        As URLs expiram em 1 hora e não autorizam qualquer escrita, mover ou excluir.
        Erros possíveis: MEDIA_NOT_FOUND, MEDIA_NOT_IN_TRAINING, TRAINING_DRIVE_NOT_CONFIGURED.
      parameters:
        - name: turma_number
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
          example: 157
        - name: drive_file_id
          in: query
          required: true
          description: ID do arquivo no Google Drive, obtido no inventário de mídias.
          schema: { type: string }
      responses:
        "200":
          description: Mídia autorizada com URLs temporárias
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/ServerError" }
  /smartops-marketing-agent-api/trainings/by-number/{turma_number}/media-access-batch:
    get:
      operationId: getTrainingMediaAccessBatch
      tags: [Treinamentos]
      summary: Acesso temporário em lote às mídias reais da turma
      description: >
        Igual ao acesso individual, porém em lote e paginado (até 50 por página).
        Sem `drive_file_ids`, usa todo o inventário da turma, opcionalmente filtrado por
        `destination_keys` e `day_number`. O `day_number` só é válido se existir na
        programação real da turma (duração dinâmica, nunca fixa em 3 dias).
      parameters:
        - name: turma_number
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
          example: 157
        - name: drive_file_ids
          in: query
          required: false
          description: Lista de IDs separados por vírgula.
          schema: { type: string }
        - name: destination_keys
          in: query
          required: false
          description: Categorias do checklist separadas por vírgula.
          schema: { type: string }
        - name: day_number
          in: query
          required: false
          description: Dia real do treinamento.
          schema: { type: integer, minimum: 1 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 25 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Página de mídias autorizadas
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/ServerError" }
  /training-testimonial-transcribe:
    post:
      operationId: transcribeTrainingTestimonial
      tags: [Depoimentos]
      summary: Transcreve um depoimento da turma
      description: >
        Transcreve o vídeo do depoimento já enviado ao Google Drive (categoria
        `videos_depoimentos`) e grava transcrição literal e revisada. Exige participante
        identificado — sem isso retorna status `awaiting_identification` e nada é publicado.
        Limite atual de 500 MB por arquivo de áudio/vídeo.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TranscribeRequest" }
            example: { drive_file_id: "ID_DO_ARQUIVO_NO_DRIVE", force: false }
      responses:
        "200":
          description: Resultado da transcrição
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestimonialResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /training-testimonial-panda-upload:
    post:
      operationId: uploadTrainingTestimonialToPanda
      tags: [Depoimentos]
      summary: Envia o depoimento à pasta oficial "Depoimentos" do Panda Video
      description: >
        Envia o depoimento do Google Drive à pasta oficial do Panda Video,
        impede duplicidade e retorna os dados do vídeo convertido.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PandaUploadRequest" }
            example: { testimonial_id: "UUID_DO_DEPOIMENTO", force_reupload: false }
      responses:
        "200":
          description: Resultado do envio ao Panda
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PandaUploadResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /training-testimonial-publish:
    post:
      operationId: publishTrainingTestimonial
      tags: [Depoimentos]
      summary: Gera e publica o artigo do depoimento na Base de Conhecimento
      description: >
        Gera e publica o artigo do depoimento após validar transcrição,
        participante, vídeo convertido no Panda e fontes da RAG.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishTestimonialRequest" }
            example: { testimonial_id: "UUID_DO_DEPOIMENTO", publish: true }
      responses:
        "200":
          description: Resultado da geração/publicação
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublishTestimonialResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /smartops-marketing-agent-deliveries/kits:
    post:
      operationId: createTrainingSocialKit
      tags: [Entregáveis]
      summary: Registra um KIT de conteúdo social da turma
      description: >
        Cria entregáveis em status `generated` para aprovação humana no Sistema B.
        Não publica, não agenda e não altera mídia do Drive.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SocialKitRequest" }
            example:
              turma_number: 157
              deliverables:
                - platform: "instagram"
                  post_type: "reel"
                  caption: "Legenda gerada a partir do contexto real da turma."
                  hashtags: ["odontologiadigital"]
                  media:
                    - drive_file_id: "EXEMPLO_FILE_ID"
                      destination_key: "videos_vertical"
                      is_cover: true
                      position: 1
      responses:
        "200":
          description: KIT registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialKitResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }
  /smartops-marketing-agent-deliveries/deliverables/{deliverable_id}:
    patch:
      operationId: reviseTrainingDeliverable
      tags: [Entregáveis]
      summary: Revisa um entregável ainda não aprovado
      description: Atualiza legenda, hashtags, CTA, título, descrição ou mídia de um entregável em status `generated`.
      parameters:
        - name: deliverable_id
          in: path
          required: true
          description: UUID do entregável.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliverableRevision" }
            example:
              caption: "Legenda revisada sem preços nem promessas de resultado."
              hashtags: ["chairsideprint"]
      responses:
        "200":
          description: Entregável atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialKitResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }

components:
  securitySchemes:
    MarketingAgentKey:
      type: http
      scheme: bearer
      description: >
        Token exclusivo servidor-servidor (SMARTOPS_MARKETING_AGENT_API_KEY).
        Chaves anon, service_role e JWT de usuário do frontend são rejeitados com 401.
  responses:
    BadRequest:
      description: Parâmetro inválido
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "Identificador inválido (use o UUID da turma ou o número da turma, ex.: 157)" }
    Unauthorized:
      description: Credencial ausente ou inválida
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "Credencial inválida" }
    Forbidden:
      description: Sem permissão para mídias de treinamento
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "Sem permissão para mídias de treinamento" }
    RateLimited:
      description: Limite de chamadas por minuto excedido
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "Limite de chamadas excedido, tente novamente em instantes" }
    NotFound:
      description: Turma ou rota não encontrada
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "Turma não encontrada" }
    MethodNotAllowed:
      description: Método de escrita bloqueado nesta fase
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "Método não permitido. Esta API é somente leitura (GET)." }
    ServerError:
      description: Erro interno
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "Erro interno ao processar a consulta" }
  schemas:
    Error:
      type: object
      properties:
        error: { type: string, description: "Mensagem de erro em português" }
      required: [error]
    TranscribeRequest:
      type: object
      description: Informe drive_file_id, media_id ou testimonial_id.
      properties:
        drive_file_id: { type: string, description: "ID do arquivo do depoimento no Google Drive" }
        media_id: { type: string, format: uuid, description: "ID do registro de mídia do Drive" }
        testimonial_id: { type: string, format: uuid, description: "ID do depoimento já registrado" }
        force: { type: boolean, default: false, description: "Reprocessa mesmo já transcrito. Só com pedido expresso do usuário." }
    TestimonialResult:
      type: object
      properties:
        testimonial_id: { type: string, format: uuid }
        status:
          type: string
          description: "uploaded | awaiting_identification | transcribing | transcribed | pending_review | failed"
        participant_name: { type: string, nullable: true }
        duration_seconds: { type: number, nullable: true }
        transcription_confidence: { type: number, nullable: true }
        transcript_raw: { type: string, nullable: true }
        transcript_revised: { type: string, nullable: true }
        analysis: { type: object, additionalProperties: true, nullable: true }
    PandaUploadRequest:
      type: object
      description: Informe testimonial_id ou drive_file_id.
      properties:
        testimonial_id: { type: string, format: uuid }
        drive_file_id: { type: string }
        force_reupload: { type: boolean, default: false, description: "Reenvia ao Panda. Só com pedido expresso do usuário." }
    PandaUploadResult:
      type: object
      properties:
        testimonial_id: { type: string, format: uuid }
        status:
          type: string
