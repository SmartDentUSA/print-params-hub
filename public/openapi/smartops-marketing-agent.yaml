openapi: 3.1.0
info:
  title: SmartOps – Marketing Treinamentos (somente leitura)
  version: "1.0.0"
  description: >
    API somente leitura do Sistema B para o GPT privado "SmartOps – Marketing Treinamentos".
    Nesta fase a API NÃO cria, atualiza ou exclui registros, não envia arquivos, não aprova
    materiais, não agenda publicações e não publica em redes sociais. Apenas GET e OPTIONS
    são aceitos; qualquer método de escrita retorna 405.
servers:
  - url: https://okeogjgqijbfkudfjadz.supabase.co/functions/v1/smartops-marketing-agent-api
    description: Edge Function pública (autenticada por Bearer token exclusivo)
security:
  - MarketingAgentKey: []
tags:
  - name: Treinamentos
    description: Consulta de turmas, participantes e mídias no Google Drive
paths:
  /eligible-trainings:
    get:
      operationId: listEligibleTrainings
      tags: [Treinamentos]
      summary: Lista turmas aptas à produção de KIT de marketing
      description: Lista turmas ativas, não canceladas, com data válida, inscrição, pasta do Drive e subpastas. Pode incluir turmas inaptas com os motivos do bloqueio. O dia da semana não define a aptidão.
      parameters:
        - name: only_eligible
          in: query
          required: false
          description: Quando true, retorna apenas turmas aptas.
          schema: { type: boolean, default: false }
        - name: limit
          in: query
          required: false
          description: Máximo de turmas retornadas (1–200).
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: Lista de turmas
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  only_eligible: { type: boolean }
                  trainings:
                    type: array
                    items: { $ref: "#/components/schemas/EligibleTraining" }
              example:
                count: 1
                only_eligible: true
                trainings:
                  - turma_id: "d45c332e-546a-4cc4-bd30-6dbd5c01af1b"
                    turma_number: 169
                    course_title: "Imersão Chairside Print"
                    turma_label: "169º"
                    start_date: "2026-10-14"
                    end_date: "2026-10-16"
                    status: "agendada"
                    enrolled_count: 12
                    companions_count: 3
                    drive_folder_url: "https://drive.google.com/drive/folders/EXEMPLO"
                    is_eligible: true
                    blocking_reasons: []
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/ServerError" }
  /trainings/by-number/{turma_number}:
    get:
      operationId: getTrainingDetails
      tags: [Treinamentos]
      summary: Dados oficiais da turma
      description: Retorna curso, número, datas, dias cadastrados, status, inscritos e completude da estrutura do Drive.
      parameters:
        - name: turma_number
          in: path
          required: true
          description: "Numero da turma (ex.: 157). Se houver mais de uma, usa a mais recente."
          schema:
            type: integer
      responses:
        "200":
          description: Detalhes da turma
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainingDetail" }
              example:
                turma_id: "d45c332e-546a-4cc4-bd30-6dbd5c01af1b"
                turma_number: 169
                turma_label: "169º"
                course: { title: "Imersão Chairside Print", slug: "imersao-chairside-print", duration_days: 3 }
                start_date: "2026-10-14"
                end_date: "2026-10-16"
                location: "São Paulo - SP"
                modality: "presencial"
                status: "agendada"
                days:
                  - { day_number: 1, date: "2026-10-14", start_time: "09:00", end_time: "18:00", topic: "Fundamentos" }
                enrolled_count: 12
                companions_count: 3
                drive_folder_id: "EXEMPLO_FOLDER_ID"
                drive_folder_url: "https://drive.google.com/drive/folders/EXEMPLO"
                drive_subfolder_keys: ["fotos_turma", "videos_vertical", "videos_depoimentos"]
                drive_structure: { expected: 10, present: 10, missing: [], complete: true }
                is_eligible: true
                blocking_reasons: []
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/ServerError" }
  /trainings/by-number/{turma_number}/participants:
    get:
      operationId: listTrainingParticipants
      tags: [Treinamentos]
      summary: Participantes exclusivos da turma
      description: >
        Retorna inscritos titulares e acompanhantes da turma informada. Não retorna CPF,
        telefone, e-mail, endereço ou outros dados desnecessários.
      parameters:
        - name: turma_number
          in: path
          required: true
          description: "Numero da turma (ex.: 157). Se houver mais de uma, usa a mais recente."
          schema:
            type: integer
      responses:
        "200":
          description: Participantes
          content:
            application/json:
              schema:
                type: object
                properties:
                  turma_id: { type: string, format: uuid }
                  turma_number: { type: integer, nullable: true }
                  count: { type: integer }
                  participants:
                    type: array
                    items: { $ref: "#/components/schemas/Participant" }
              example:
                turma_id: "d45c332e-546a-4cc4-bd30-6dbd5c01af1b"
                turma_number: 169
                count: 2
                participants:
                  - enrollment_id: "11111111-1111-1111-1111-111111111111"
                    participant_name: "PARTICIPANTE EXEMPLO 1"
                    participant_type: "titular"
                    enrollment_status: "finalizado"
                    companion_id: null
                    companion_name: null
                    companion_type: null
                  - enrollment_id: "11111111-1111-1111-1111-111111111111"
                    participant_name: "PARTICIPANTE EXEMPLO 1"
                    participant_type: "titular"
                    enrollment_status: "finalizado"
                    companion_id: "22222222-2222-2222-2222-222222222222"
                    companion_name: "ACOMPANHANTE EXEMPLO"
                    companion_type: "acompanhante"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/ServerError" }
  /trainings/by-number/{turma_number}/media-inventory:
    get:
      operationId: getTrainingMediaInventory
      tags: [Treinamentos]
      summary: Inventário real das mídias no Google Drive
      description: Consulta as subpastas da turma no Google Drive e retorna arquivos, formatos, tamanhos, dimensões, orientação, dia, participante e situação no banco. Não expõe credenciais nem sessões de upload.
      parameters:
        - name: turma_number
          in: path
          required: true
          description: "Numero da turma (ex.: 157). Se houver mais de uma, usa a mais recente."
          schema:
            type: integer
      responses:
        "200":
          description: Inventário
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaInventory" }
              example:
                turma_id: "d45c332e-546a-4cc4-bd30-6dbd5c01af1b"
                turma_number: 169
                course_title: "Imersão Chairside Print"
                drive_folder_url: "https://drive.google.com/drive/folders/EXEMPLO"
                total_files: 1
                missing_subfolders: []
                destinations:
                  - destination_key: "videos_vertical"
                    label: "04 - Vídeos Originais › 01 - Vídeos Verticais"
                    kind: "video"
                    requires_day: true
                    is_testimonial: false
                    drive_folder_id: "EXEMPLO_SUBFOLDER_ID"
                    file_count: 1
                    drive_error: null
                    files:
                      - drive_file_id: "EXEMPLO_FILE_ID"
                        filename: "T169_IMERSAO_CHAIRSIDE_PRINT_2026-10-14_DIA-1_VIDEO_VERTICAL_001.mp4"
                        mime_type: "video/mp4"
                        size_bytes: 48213456
                        created_time: "2026-10-14T18:22:03.000Z"
                        width: 1080
                        height: 1920
                        orientation: "vertical"
                        kind: "video"
                        day: "Dia 1"
                        participant_name: null
                        db_status: "completed"
                        registered_in_db: true
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/ServerError" }
  /trainings/by-number/{turma_number}/media-gaps:
    get:
      operationId: getTrainingMediaGaps
      tags: [Treinamentos]
      summary: Lacunas de mídia frente ao checklist oficial
      description: Compara o Google Drive com o checklist e informa categorias ausentes, vídeos sem dia, depoimentos sem participante, formatos inválidos, falhas e divergências entre Drive e banco.
      parameters:
        - name: turma_number
          in: path
          required: true
          description: "Numero da turma (ex.: 157). Se houver mais de uma, usa a mais recente."
          schema:
            type: integer
      responses:
        "200":
          description: Lacunas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaGaps" }
              example:
                turma_id: "d45c332e-546a-4cc4-bd30-6dbd5c01af1b"
                turma_number: 169
                course_title: "Imersão Chairside Print"
                present_categories: ["videos_vertical"]
                missing_categories: ["fotos_turma", "fotos_participantes_certificados", "videos_depoimentos"]
                videos_without_day: []
                testimonials_without_participant: []
                participants_without_testimonial: ["PARTICIPANTE EXEMPLO 1"]
                invalid_formats: []
                pending_records: []
                failed_records: []
                drive_files_without_db_record: []
                db_records_without_drive_file: []
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/ServerError" }

components:
  securitySchemes:
    MarketingAgentKey:
      type: http
      scheme: bearer
      description: >
        Token exclusivo servidor-servidor (SMARTOPS_MARKETING_AGENT_API_KEY).
        Chaves anon, service_role e JWT de usuário do frontend são rejeitados com 401.
  responses:
    BadRequest:
      description: Parâmetro inválido
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "Identificador inválido (use o UUID da turma ou o número da turma, ex.: 157)" }
    Unauthorized:
      description: Credencial ausente ou inválida
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "Credencial inválida" }
    NotFound:
      description: Turma ou rota não encontrada
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "Turma não encontrada" }
    MethodNotAllowed:
      description: Método de escrita bloqueado nesta fase
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "Método não permitido. Esta API é somente leitura (GET)." }
    ServerError:
      description: Erro interno
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "Erro interno ao processar a consulta" }
  schemas:
    Error:
      type: object
      properties:
        error: { type: string, description: "Mensagem de erro em português" }
      required: [error]
    EligibleTraining:
      type: object
      properties:
        turma_id: { type: string, format: uuid }
        turma_number: { type: integer, nullable: true }
        course_title: { type: string }
        turma_label: { type: string, nullable: true }
        start_date: { type: string, nullable: true, description: "Data ISO (yyyy-mm-dd)" }
        end_date: { type: string, nullable: true }
        status:
          type: string
          description: "agendada | em_andamento | concluida | cancelada | inativa | sem_data"
        enrolled_count: { type: integer }
        companions_count: { type: integer }
        drive_folder_url: { type: string, nullable: true }
        is_eligible: { type: boolean }
        blocking_reasons: { type: array, items: { type: string } }
    TurmaDay:
      type: object
      properties:
        day_number: { type: integer, nullable: true }
        date: { type: string, nullable: true }
        start_time: { type: string, nullable: true }
        end_time: { type: string, nullable: true }
        topic: { type: string, nullable: true }
    TrainingDetail:
      type: object
      properties:
        turma_id: { type: string, format: uuid }
        turma_number: { type: integer, nullable: true }
        turma_label: { type: string, nullable: true }
        course:
          type: object
          properties:
            title: { type: string }
            slug: { type: string, nullable: true }
            duration_days: { type: integer, nullable: true }
        start_date: { type: string, nullable: true }
        end_date: { type: string, nullable: true }
        location: { type: string, nullable: true }
        modality: { type: string, nullable: true }
        status: { type: string }
        days: { type: array, items: { $ref: "#/components/schemas/TurmaDay" } }
        enrolled_count: { type: integer }
        companions_count: { type: integer }
        drive_folder_id: { type: string, nullable: true }
        drive_folder_url: { type: string, nullable: true }
        drive_subfolder_keys: { type: array, items: { type: string } }
        drive_structure:
          type: object
          properties:
            expected: { type: integer }
            present: { type: integer }
            missing: { type: array, items: { type: string } }
            complete: { type: boolean }
        is_eligible: { type: boolean }
        blocking_reasons: { type: array, items: { type: string } }
    Participant:
      type: object
      properties:
        enrollment_id: { type: string, format: uuid }
        participant_name: { type: string, nullable: true }
        participant_type: { type: string, description: "titular" }
        enrollment_status: { type: string, nullable: true }
        companion_id: { type: string, format: uuid, nullable: true }
        companion_name: { type: string, nullable: true }
        companion_type: { type: string, nullable: true, description: "acompanhante" }
    MediaFile:
      type: object
      properties:
        drive_file_id: { type: string }
        filename: { type: string }
        mime_type: { type: string, nullable: true }
        size_bytes: { type: integer, nullable: true }
        created_time: { type: string, nullable: true }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        orientation: { type: string, nullable: true, description: "vertical | horizontal" }
        kind: { type: string, description: "photo | video" }
        day: { type: string, description: "Dia 1 | Dia 2 | Dia 3 | Geral" }
        participant_name: { type: string, nullable: true }
        db_status: { type: string, nullable: true }
        registered_in_db: { type: boolean }
    MediaDestination:
      type: object
      properties:
        destination_key:
          type: string
          description: >
            fotos_turma | fotos_participantes_certificados | fotos_atividades | fotos_equipamentos |
            fotos_bastidores | videos_vertical | videos_horizontal | videos_depoimentos |
            videos_atividades | videos_bastidores
        label: { type: string }
        kind: { type: string }
        requires_day: { type: boolean }
        is_testimonial: { type: boolean }
        drive_folder_id: { type: string }
        file_count: { type: integer }
        drive_error: { type: string, nullable: true }
        files: { type: array, items: { $ref: "#/components/schemas/MediaFile" } }
    MediaInventory:
      type: object
      properties:
        turma_id: { type: string, format: uuid }
        turma_number: { type: integer, nullable: true }
        course_title: { type: string }
        drive_folder_url: { type: string, nullable: true }
        total_files: { type: integer }
        missing_subfolders: { type: array, items: { type: string } }
        destinations: { type: array, items: { $ref: "#/components/schemas/MediaDestination" } }
    MediaGapItem:
      type: object
      properties:
        destination_key: { type: string }
        filename: { type: string, nullable: true }
        drive_file_id: { type: string, nullable: true }
        mime_type: { type: string, nullable: true }
        expected_kind: { type: string, nullable: true }
        status: { type: string, nullable: true }
        error: { type: string, nullable: true }
    MediaGaps:
      type: object
      properties:
        turma_id: { type: string, format: uuid }
        turma_number: { type: integer, nullable: true }
        course_title: { type: string }
        present_categories: { type: array, items: { type: string } }
        missing_categories: { type: array, items: { type: string } }
        videos_without_day: { type: array, items: { $ref: "#/components/schemas/MediaGapItem" } }
        testimonials_without_participant: { type: array, items: { $ref: "#/components/schemas/MediaGapItem" } }
        participants_without_testimonial: { type: array, items: { type: string } }
        invalid_formats: { type: array, items: { $ref: "#/components/schemas/MediaGapItem" } }
        pending_records: { type: array, items: { $ref: "#/components/schemas/MediaGapItem" } }
        failed_records: { type: array, items: { $ref: "#/components/schemas/MediaGapItem" } }
        drive_files_without_db_record: { type: array, items: { $ref: "#/components/schemas/MediaGapItem" } }
        db_records_without_drive_file: { type: array, items: { $ref: "#/components/schemas/MediaGapItem" } }
